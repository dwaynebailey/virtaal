# See https://pre-commit.com for more information
# Deliberately minimal for now: general hygiene checks only, no
# formatter/linter (e.g. Black) yet - that's a separate decision, see
# ISSUE_TRIAGE.md's "Evaluate adopting Black" item.
#
# po/*.po and po/virtaal.pot are machine-generated by msgmerge/
# intltool-update, so the hygiene hooks below skip them (`exclude` is
# per-hook, not global, so that a file like po/POTFILES.in - hand-
# maintained, just happens to live in the same directory - and the
# check-pot-freshness hook further down still get seen normally).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.pot?$
      - id: end-of-file-fixer
        exclude: \.pot?$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-ast
      - id: debug-statements

  - repo: local
    hooks:
      - id: check-pot-freshness
        name: check po/virtaal.pot is up to date with translatable sources
        entry: po/check-pot-freshness.sh
        language: system
        pass_filenames: true
