name: Tests

on:
  push:
    branches: [master, py3]
  pull_request:
  workflow_dispatch:
    inputs:
      debug_windows:
        description: "Open an SSH debug session (tmate) on the Windows job, right before the step that's been crashing with no output"
        type: boolean
        default: false

jobs:
  pre-commit:
    # Lints only the files that changed, not the whole tree: many
    # pre-existing files don't pass .pre-commit-config.yaml's hooks yet
    # (see ISSUE_TRIAGE.md), so `pre-commit run --all-files` would fail
    # here on old, unrelated files rather than anything actually being
    # worked on. Falls back to the parent commit, then to --all-files,
    # if there's no usable diff base (first push to a branch, a force
    # push, or a repo's very first commit).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # A force-push (e.g. after a rebase) can leave github.event.before
            # pointing at a commit this checkout no longer has at all -
            # confirmed via a real run: "fatal: Invalid revision range".
            base=""
          fi
          if [ -z "$base" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            pre-commit run --all-files
          else
            pre-commit run --from-ref "$base" --to-ref HEAD
          fi

  docs-and-translations:
    # ./maketranslations (merges po/ into .desktop/.metainfo/.mime XML via
    # intltool-merge) and `make docs` (Sphinx) aren't packaging- or
    # platform-specific - they don't touch GTK/PyGObject at all - so they
    # get their own job instead of running once per matrix cell like
    # before (5x on Linux alone, for each Python version, then again on
    # macOS: none of those repeats were testing anything different).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y intltool

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install Sphinx

      - name: Update translations
        run: ./maketranslations

      - name: Build docs
        run: make docs

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 at-spi2-core gobject-introspection \
            libgirepository-2.0-dev libglib2.0-dev libcairo2-dev \
            pkg-config python3-dev libgnutls28-dev xvfb \
            gir1.2-gtkspell3-3.0 libenchant-2-dev hunspell-en-us

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Needed explicitly because "Install virtaal" below uses
          # --no-build-isolation: pip normally provisions setuptools (the
          # build backend) into a throwaway isolated build env itself,
          # but with isolation off it expects setuptools to already be
          # here - recent Python/venvs no longer bundle it by default.
          pip install setuptools wheel
          # translate-toolkit specifically has to be pre-installed, not
          # just declared as a dependency below: setup.py's own top-level
          # code imports it directly (for .mo compilation), which runs
          # during "Install virtaal" itself, before pip has had a chance
          # to satisfy pyproject.toml's declared dependencies.
          pip install translate-toolkit
          # GTK3/PyGObject aren't declared in pyproject.toml at all -
          # `pip install pygobject` only succeeds with GTK3 headers
          # already present, which apt provides here but pyproject.toml
          # can't express portably. See pyproject.toml's own comment.
          pip install pygobject
          pip install pyenchant

      - name: Install virtaal
        # Not `python setup.py install`: setup.py's first import is
        # `from setuptools import setup`, and invoking it directly
        # (rather than through pip) is unreliable about where it puts
        # the script. --no-build-isolation so setup.py's own top-level
        # `from translate.tools.pocompile import convertmo` sees the
        # translate-toolkit installed above. `.[test]` pulls in
        # pyproject.toml's declared dependencies (pycurl, lxml,
        # diff_match_patch, python-Levenshtein, cheroot, and
        # translate-toolkit again - harmless, already satisfied) plus
        # pytest, in one step instead of nine separate `pip install`
        # lines.
        run: pip install --no-build-isolation .[test]

      - name: Compile-check all Python files
        run: find . -name "*.py" -exec python -m py_compile {} +

      - name: Run tests
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" pytest -rvxs virtaal

      - name: Smoke test the CLI
        run: xvfb-run -a --server-args="-screen 0 1024x768x24" virtaal --help

  test-macos:
    runs-on: macos-latest
    # Single Python version (whatever Homebrew currently ships), not the
    # 3.10-3.14 matrix the Linux job runs: unlike apt, Homebrew doesn't
    # provide an easy way to build PyGObject against several Python
    # versions at once, and this job's whole approach hinges on using
    # Homebrew's own Python (see the venv step below) rather than
    # actions/setup-python's.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system dependencies (Homebrew)
        # Mirrors .claude/skills/run-virtaal/SKILL.md's prerequisites,
        # verified working manually on macOS during this project's py3
        # port: pygobject3/gtk+3 for the app itself, gtk-mac-integration
        # for native macOS menu-bar support, enchant/gtkspell3 for the
        # spellchecker plugin. gobject-introspection/cairo/pkg-config/
        # gettext are build-time needs `pip install pygobject` depends on
        # that apt provides directly on the Linux job but Homebrew splits
        # into separate formulae.
        run: |
          # GitHub's macos-latest image comes with aws/tap pre-tapped but
          # untrusted, which prints an "untrusted tap" warning on every
          # `brew install` even though we never use it - untap it (not
          # HOMEBREW_NO_REQUIRE_TAP_TRUST, which Homebrew's own message
          # says is being removed) since nothing here needs it.
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        # --system-site-packages so this venv's Python can see Homebrew's
        # compiled `gi` module, the same reason
        # .claude/skills/run-virtaal/driver.sh's setup uses it locally -
        # a plain venv can't see Homebrew's gi at all. Appending to
        # GITHUB_PATH (rather than `source .venv/bin/activate`, which
        # only affects the shell it runs in) makes every later step in
        # this job use the venv automatically.
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          # Pre-installed for the same reason as the Linux job: setup.py
          # imports it directly at the top level, before pyproject.toml's
          # declared dependencies get a chance to be satisfied. GTK3/
          # PyGObject need no separate pip install here (unlike Linux) -
          # the --system-site-packages venv above already sees Homebrew's
          # brew-installed `gi` module directly.
          pip install translate-toolkit
          pip install pyenchant

      - name: Install virtaal
        # .[test] pulls in pyproject.toml's declared dependencies
        # (pycurl, lxml, diff_match_patch, python-Levenshtein, cheroot)
        # plus pytest, in one step instead of eight separate ones.
        run: pip install --no-build-isolation .[test]

      - name: Compile-check all Python files
        run: find . -name "*.py" -exec python -m py_compile {} +

      - name: Run tests
        # No xvfb-run equivalent: macOS's WindowServer is a real system
        # daemon that's always running, even in CI, unlike X11 which has
        # no display server at all without one. If that assumption turns
        # out wrong for some GTK operation, this is the step that will
        # show it.
        run: pytest -rvxs virtaal

      - name: Smoke test the CLI
        run: virtaal --help

  build-macos-app:
    runs-on: macos-latest
    needs: test-macos
    # Separate job from test-macos, not extra steps tacked onto it:
    # PyInstaller has to trace and copy the whole dependency tree, which
    # is genuinely slow, and this only needs to run once the fast pytest
    # job has already confirmed the app itself works - no point spending
    # the extra time building a bundle around a broken app.
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Same Homebrew/venv setup as test-macos - PyInstaller needs a real,
      # working GTK3/PyGObject environment to trace and bundle, not just
      # virtaal's own pure-Python dependencies.
      - name: Install system dependencies (Homebrew)
        run: |
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install translate-toolkit
          pip install pyenchant
          pip install pyinstaller

      - name: Install virtaal
        run: pip install --no-build-isolation .

      - name: Build self-contained .app bundle
        run: devsupport/packaging/macos/build_standalone.sh

      - name: Verify the bundle launches cleanly
        # Same shape of check as the run-virtaal skill's driver: launch
        # with a real file in the background, confirm the process is
        # still alive after enough time for GTK/plugin init, and confirm
        # the log is clean - empty, not just "didn't crash". enchant is
        # deliberately excluded from this bundle (see virtaal.spec's
        # comment) so "Failed to load plugin spellchecker"-type lines
        # are expected and fine; anything else in the log is not.
        run: |
          dist/Virtaal.app/Contents/MacOS/virtaal devsupport/testfiles/checks.po > /tmp/bundle-launch.log 2>&1 &
          PID=$!
          sleep 6
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Bundle exited within 6s of launch"
            cat /tmp/bundle-launch.log
            exit 1
          fi
          kill "$PID"
          pkill -f virtaal.support.tmserver || true
          if grep -Eqv "spellchecker|enchant|GtkosxApplication" /tmp/bundle-launch.log; then
            echo "::error::Unexpected output in the bundle's log"
            cat /tmp/bundle-launch.log
            exit 1
          fi

      - name: Package the bundle for upload
        # Confirmed by hitting this for real: pointing upload-artifact
        # straight at the dist/Virtaal.app *directory* lets its own
        # zip/re-serve pipeline mangle the bundle - the code signature
        # (embedded in Contents/_CodeSignature, hashes every file's exact
        # bytes/permissions) came out invalid on download, which macOS
        # reports as "Virtaal.app is damaged and can't be opened" -
        # persists even after clearing the quarantine flag, since it's a
        # broken signature, not a quarantine block. `ditto` is Apple's own
        # tool for archiving app bundles for exactly this reason (it's
        # what Apple's own notarization tooling recommends for zipping a
        # .app before upload) - unlike a plain zip/tar, it's bundle-aware
        # and preserves the signature, symlinks (including
        # Contents/MacOS/share), and extended attributes faithfully.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Virtaal.app dist/Virtaal-macos-app.zip

      - name: Verify the signature survives the archive step
        # Cheap, immediate check that the fix above actually works,
        # rather than only finding out from a user's download failing
        # again - unzip with ditto (not plain unzip - same bundle-aware
        # reasoning as packaging) and re-check codesign right here.
        run: |
          ditto -x -k dist/Virtaal-macos-app.zip /tmp/verify-signature
          codesign -dv --verbose=4 /tmp/verify-signature/Virtaal.app

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-macos-app
          path: dist/Virtaal-macos-app.zip
          if-no-files-found: error

      - name: Build .dmg installer
        run: devsupport/packaging/macos/build_dmg.sh

      - name: Verify the .dmg mounts and contains a real app
        # A .dmg is a single opaque file, unlike the raw .app directory
        # above - no ditto-style archiving trick needed for the artifact
        # upload itself, but still worth confirming the disk image is
        # genuinely mountable and has what it should before shipping it
        # as a build artifact, rather than assuming dmgbuild succeeding
        # silently means the result is actually usable.
        run: |
          hdiutil attach dist/Virtaal.dmg -mountpoint /tmp/verify-dmg -nobrowse -quiet
          test -x /tmp/verify-dmg/Virtaal.app/Contents/MacOS/virtaal
          test -L /tmp/verify-dmg/Applications
          hdiutil detach /tmp/verify-dmg -quiet

      - uses: actions/upload-artifact@v7
        with:
          name: Virtaal-macos-dmg
          path: dist/Virtaal.dmg
          if-no-files-found: error

  test-windows:
    runs-on: windows-latest
    # Second attempt - the first (MSYS2's own Python via pacman) got as
    # far as installing GTK3/PyGObject fine, then broke on
    # translate-toolkit's own dependency chain: unicode-segmentation-rs
    # (a hard requirement, confirmed via `pip download --no-deps` +
    # metadata inspection, not optional) ships prebuilt wheels only for
    # the standard win32/win_amd64 CPython ABI, not MSYS2's
    # mingw_x86_64_ucrt_gnu tag - falls back to a source build, which then
    # fails because maturin doesn't support that platform either. MSYS2's
    # Python and "regular" Windows Python are two separately-ABI'd
    # ecosystems; mixing them (e.g. MSYS2 GTK + setup-python's Python)
    # doesn't dodge this, it just relocates the same mismatch to
    # PyGObject's own compiled _gi extension instead.
    #
    # This attempt uses gvsbuild instead: it publishes prebuilt GTK3
    # binaries (GTK3_Gvsbuild_<version>_x64.zip, confirmed to exist via
    # `gh api repos/wingtk/gvsbuild/releases/latest`) that a *regular*
    # actions/setup-python CPython can build PyGObject against via MSVC
    # (preinstalled on windows-latest runners) - staying in the standard
    # wheel ecosystem for everything else (translate-toolkit, pycurl,
    # etc.), unlike MSYS2. Pattern taken from a real project doing the
    # same thing (gaphor/gaphor's full-build.yml), not reconstructed from
    # docs alone.
    #
    # Spellchecker (enchant/gtkspell3) deliberately left out for this
    # first attempt to keep scope down - the plugin degrades gracefully
    # without it, same as it does today when those aren't installed
    # locally (see the run-virtaal skill's notes).
    env:
      gvsbuild_version: "2026.8.0"
      # INCLUDE/LIB deliberately NOT set here as static job-level values
      # any more: they need to be *appended to* whatever ilammy/msvc-dev-cmd
      # computes below (its own INCLUDE/LIB, for the MSVC/Windows SDK
      # headers and import libs cl.exe itself needs), not replace it - see
      # the "Add GTK3 to MSVC build environment" step.
      CC: cl
      CXX: cl
      # Force meson (pygobject's build backend) to use MSVC unambiguously.
      # Without this, meson's own compiler auto-detection picked up
      # Strawberry Perl's gcc/ccache from PATH instead (windows-latest
      # runners ship it for Perl-dependent builds) - confirmed directly
      # from a real build log: `"C:\Strawberry\c\bin\ccache.exe" "cc"`
      # compiling gi/_gi's sources, failing with `fatal error: glib.h: No
      # such file or directory` / `girepository/girepository.h: No such
      # file or directory`. That's not a missing-file problem - it's that
      # gcc doesn't consult the Windows INCLUDE env var the way cl.exe
      # does, so C:\gtk\include was invisible to it regardless of how
      # correctly INCLUDE was set.
      PKG_CONFIG_PATH: 'C:\gtk\lib\pkgconfig'
      # PATH (added via GITHUB_PATH, see below) covers DLL loading, but
      # `import gi`/gi.require_version() needs this separately for
      # resolving .typelib files - without it, `from gi.repository import
      # Gtk` silently fails (caught by depcheck.py's broad `except
      # Exception`), surfacing indirectly as "Failed dependencies: gtk"
      # rather than the real underlying ImportError. Confirmed as the
      # cause by elimination: pip install pygobject succeeded, but
      # nothing had actually exercised a real `from gi.repository import
      # Gtk` yet at that point - depcheck's test_gtk_version() was the
      # first thing to actually try.
      GI_TYPELIB_PATH: 'C:\gtk\lib\girepository-1.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache GTK3 (gvsbuild)
        id: cache-gtk
        uses: actions/cache@v6
        with:
          path: C:\gtk
          key: windows-gvsbuild-${{ env.gvsbuild_version }}

      - name: Download prebuilt GTK3 (gvsbuild)
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          gh release download --repo wingtk/gvsbuild "${{ env.gvsbuild_version }}" -p "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip"
          7z x "GTK3_Gvsbuild_${{ env.gvsbuild_version }}_x64.zip" -oC:\gtk -y
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add GTK3 to PATH
        # Not a job-level `env: PATH:` entry - that would *replace* the
        # runner's whole PATH for every step (including this one's own
        # git/python/pwsh), not append to it. GITHUB_PATH is the correct
        # mechanism: prepends for every step from here on, additively.
        shell: pwsh
        run: echo "C:\gtk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC build environment
        # windows-latest has the MSVC toolchain (cl.exe) installed but not
        # on PATH/INCLUDE/LIB by default - this is the standard action for
        # running the equivalent of vcvarsall.bat and persisting the
        # result (PATH, INCLUDE, LIB, LIBPATH) into $GITHUB_ENV/PATH for
        # every later step. Needed so CC=cl/CXX=cl (above) actually
        # resolves to a working compiler, not just a name meson can't find.
        #
        # Still on Node 20 as of the latest release (v1.13.0) - confirmed
        # by checking that release's own action.yml, not assumed - unlike
        # actions/cache and actions/upload-artifact above, there's no
        # newer major version to bump to yet. GitHub currently force-runs
        # it on Node 24 anyway, so this is a "wait for upstream" item, not
        # something fixable from this side.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add GTK3 to MSVC build environment
        # Must run *after* msvc-dev-cmd, appending to its INCLUDE/LIB
        # rather than replacing them (a static job-level env: INCLUDE=...
        # would instead get replaced *by* msvc-dev-cmd's own INCLUDE, per
        # normal $GITHUB_ENV precedence - same clobbering pattern as
        # PKG_CONFIG_PATH below, just the reverse order) - cl.exe needs
        # its own CRT/Windows SDK headers/libs (from msvc-dev-cmd) *and*
        # GTK3's (from gvsbuild) at once.
        shell: pwsh
        run: |
          echo "INCLUDE=$env:INCLUDE;C:\gtk\include;C:\gtk\include\cairo;C:\gtk\include\glib-2.0;C:\gtk\include\gobject-introspection-1.0;C:\gtk\lib\glib-2.0\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$env:LIB;C:\gtk\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Restore PKG_CONFIG_PATH after setup-python
        # actions/setup-python writes its own PKG_CONFIG_PATH (pointing at
        # its own interpreter's pkgconfig dir, for finding python3.pc) via
        # $GITHUB_ENV during setup - confirmed via the job's own env dumps
        # in the Actions log: still C:\gtk\lib\pkgconfig going into the
        # setup-python step, already clobbered to
        # .../hostedtoolcache/.../lib/pkgconfig by the very next step. Per
        # GitHub Actions precedence, a step writing $GITHUB_ENV overrides
        # the job-level `env:` for every step from that point on, so
        # without this, `pip install pygobject`'s meson build loses
        # pkg-config's ability to find glib/gobject-introspection/gtk3's
        # .pc files right when it matters - INCLUDE/LIB (MSVC) still find
        # headers/import libs, so the build doesn't hard-fail, but the
        # resulting _gi extension is suspected to end up with broken/
        # partial GTK bindings, surfacing later as a silent, no-output
        # native crash in "Run tests" the moment `from gi.repository
        # import Gtk` is actually exercised for real (pytest collection is
        # the first thing in the job that does - `py_compile` is a syntax
        # check only, never imports anything, which is why it stayed
        # clean).
        shell: pwsh
        run: echo "PKG_CONFIG_PATH=C:\gtk\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure GTK3 DLLs are found by Python's extension loader
        # Python 3.8+ deliberately no longer searches PATH for an
        # extension module's own dependent DLLs (SetDefaultDllDirectories
        # at interpreter startup drops the default search dirs down to
        # just the app dir, System32, and os.add_dll_directory()-added
        # ones) - confirmed as the cause of a real, reproducible failure:
        # `from gi.repository import Gtk` raising `ImportError: DLL load
        # failed while importing _gi: The specified module could not be
        # found.`, even with C:\gtk\bin correctly on PATH and _gi.pyd
        # itself built fine. A sitecustomize.py is the standard fix for
        # this exact, well-known class of problem - Python auto-imports
        # it at interpreter startup, so this covers every later step and
        # process in the job (pytest, the CLI smoke test) without
        # touching virtaal's own platform-neutral source.
        shell: pwsh
        run: |
          $sitepkgs = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $content = "import os`nif os.name == 'nt':`n    os.add_dll_directory(r'C:\gtk\bin')`n"
          Set-Content -Path "$sitepkgs\sitecustomize.py" -Value $content -NoNewline

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools wheel
          pip install pycairo
          pip install pygobject
          pip install translate-toolkit
          pip install python-Levenshtein
          pip install pycurl
          pip install lxml
          pip install diff_match_patch
          pip install cheroot
          pip install pytest

      - name: Install virtaal
        run: pip install --no-build-isolation .

      - name: Compile-check all Python files
        run: |
          Get-ChildItem -Recurse -Filter *.py | ForEach-Object { python -m py_compile $_.FullName }

      - name: Smoke test the GTK3 import
        # Cheap, fast canary that isolates GTK3 DLL/typelib loading (the
        # first real `from gi.repository import Gtk` in the whole job -
        # `py_compile` above is a syntax check only and never imports
        # anything) from pytest and virtaal's own code - originally added
        # to bisect a silent native-crash failure in "Run tests" down to
        # this exact import (an ImportError from Python 3.8+'s stricter
        # extension-module DLL search, fixed by the sitecustomize.py step
        # above). Kept as a permanent, fast-failing check for the same
        # class of regression.
        run: |
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())"
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Debug via tmate (manual trigger only)
        # Opens an interactive SSH session into this exact runner, right
        # before the step that's been crashing with zero output - only
        # when manually dispatched with debug_windows=true, never on a
        # normal push/PR. The point: a fresh local Windows VM likely
        # wouldn't reproduce this crash at all (tied to this exact
        # gvsbuild/MSVC/Python combination); this gets a shell in the
        # actual environment where it does reproduce, to set up crash-dump
        # collection (e.g. Windows Error Reporting LocalDumps) or attach a
        # debugger before triggering it deliberately, rather than only
        # finding out post-mortem.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_windows }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30

      - name: Run tests
        # No xvfb-run equivalent, same reasoning as the macOS job: Windows
        # always has its own native windowing system available, even in a
        # non-interactive CI session, unlike X11 - confirmed fine, this
        # was never the problem.
        #
        # This step used to crash here with zero output - not even a
        # Python traceback - constructing the app's first real window
        # (MainController.__init__ -> MainView(self)). Root-caused and
        # fixed: mainview.py's set_icon_from_file() loaded virtaal.ico,
        # but the pinned gvsbuild GTK3 build only ships gdk-pixbuf's SVG
        # loader plugin, no ICO loader - raising an uncaught GLib.GError
        # that looked like a silent crash only because pan_app.py
        # separately (also since fixed) redirected stdout/stderr to a log
        # file nobody was reading. See ISSUE_TRIAGE.md's Windows CI crash
        # entry for the full diagnostic history.
        run: pytest -rvxs virtaal
        env:
          PYTHONFAULTHANDLER: "1"

      - name: Smoke test the CLI
        run: virtaal --help
