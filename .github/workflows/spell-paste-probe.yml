name: Spell paste probe

# Temporary: where a 100k paste spends its time on macOS (#4443).
on:
  # A dispatch needs the file on the default branch.
  push:
    branches: [away-1.0.1/packaged-spellcheck-clean]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies (Homebrew)
        run: |
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install virtaal
        run: pip install --ignore-installed .[spellcheck]

      - name: Sample the spelling sweep's 100k paste
        timeout-minutes: 25
        run: |
          python devsupport/testing/fuzz/fuzz_ui.py --sections spelling --no-random --results fuzz-results > fuzz.out 2>&1 &
          fuzz=$!
          n=0
          while kill -0 "$fuzz" 2>/dev/null; do
            pid=$(pgrep -f "sweep.py spelling" | head -1 || true)
            if [ -n "$pid" ]; then
              n=$((n + 1))
              sample "$pid" 2 -file "sample-$n.txt" >/dev/null 2>&1 || true
            fi
            sleep 1
          done
          best=$(grep -c "gtk_text_buffer_insert_interactive" sample-*.txt 2>/dev/null | sort -t: -k2 -n | tail -1 | cut -d: -f1)
          echo "samples: $n, deepest insert: $best"
          [ -n "$best" ] && awk '/Call graph:/,/Total number in stack/' "$best" | grep -v "^ *[0-9]* *Thread_" | head -150 | cut -c1-220
          tail -30 fuzz.out
