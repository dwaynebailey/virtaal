name: Spell paste probe

# Temporary: where a 100k paste spends its time on macOS (#4443).
on:
  # A dispatch needs the file on the default branch.
  push:
    branches: [away-1.0.1/packaged-spellcheck-clean]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies (Homebrew)
        run: |
          brew untap aws/tap || true
          brew install pygobject3 gtk+3 gtk-mac-integration \
            gobject-introspection cairo pkg-config gettext \
            enchant gtkspell3

      - name: Create venv with system site-packages
        run: |
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install virtaal
        run: pip install --ignore-installed .[spellcheck]

      - name: Sample the spelling sweep's 100k paste
        timeout-minutes: 25
        run: |
          python devsupport/testing/fuzz/fuzz_ui.py --sections spelling --no-random --case-timeout 90 --results fuzz-results > fuzz.out 2>&1 &
          for i in $(seq 600); do
            grep -qs '"case": "100k chars"' fuzz-results/spelling-0.log && break
            sleep 1
          done
          pid=$(pgrep -f "sweep.py spelling" | head -1)
          echo "pid $pid after ${i}s"
          sleep 4
          sample "$pid" 6 -file sample.txt || true
          awk '/Call graph:/,/Total number in stack/' sample.txt | grep -v "^ *[0-9]* *Thread_" | head -120 | cut -c1-220
          wait || true
          tail -30 fuzz.out
